name: Build Custom APK

on:
  push:
    branches: [ "master", "main", "build/*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee build-main.log
          ./gradlew :assembleReleasePlugins 2>&1 | tee build-plugins.log

      - name: Upload main APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-android-custom
          path: app/build/outputs/apk/release/

      - name: Pack plugins
        shell: bash
        run: |
          mkdir -p plugins-to-upload
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/release" "plugins-to-upload/${i}" 2>/dev/null || true
            fi
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-plugins
          path: plugins-to-upload

      - name: Save failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/cilog
          tail -c 300000 build-main.log > /tmp/cilog/build-main.log 2>/dev/null || true
          tail -c 300000 build-plugins.log > /tmp/cilog/build-plugins.log 2>/dev/null || true
          cd /tmp/cilog
          if [ ! -s build-main.log ] && [ ! -s build-plugins.log ]; then exit 0; fi
          git init -q
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-log-bot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git checkout -q -B ci-logs
          git add -A
          git commit -q -m "ci failure log for ${{ github.sha }}" || true
          git push -q -f origin ci-logs
